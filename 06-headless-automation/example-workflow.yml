# Copy this file to .github/workflows/pr-audit.yml in the repository you want
# audited. It is deliberately NOT in .github/workflows/ here, because this repo
# is the teaching material, not the thing under review.
#
# Three things in this file are the lesson:
#   1. the step reads from /dev/null, so nothing can ever wait for a keyboard
#   2. the exit code is read, and 1 and 2 are handled differently
#   3. the key comes from the secret store, is scoped to one step, and is never
#      echoed, never passed as a flag, and never written into the report
name: pr-audit

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Build the diff for this pull request
        run: git diff --unified=3 "origin/${{ github.base_ref }}...HEAD" > pr.diff

      - name: Run the audit
        id: audit
        env:
          # The only step that sees the key. Never at job or workflow level.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          uv run python audit.py \
            --diff pr.diff \
            --schema audit-schema.json \
            --max-seconds 120 \
            < /dev/null > report.json 2> audit.log
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: The audit itself broke
        if: steps.audit.outputs.code == '1'
        run: |
          cat audit.log
          echo "The audit did not run. This is not a clean review."
          exit 1

      - name: Post the report
        if: steps.audit.outputs.code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # audit.py redacts its own output before writing it, so nothing posted
        # here can carry a credential even if the diff contained one.
        run: gh pr comment "${{ github.event.number }}" --body-file report.json

      - name: Block the merge
        if: steps.audit.outputs.code == '2'
        run: exit 1
