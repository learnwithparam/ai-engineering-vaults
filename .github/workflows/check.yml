name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned exact on purpose. setup-uv stopped publishing floating major
      # and minor tags at v8, so @v10 does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      # No API key is configured for CI on purpose. Every notebook runs from
      # committed fixtures, so a fork can run the full gate and spend nothing.
      - name: Gates
        run: make check

      - name: Execute every notebook in replay
        run: make test
