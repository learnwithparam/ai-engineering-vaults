[project]
name = "ai-engineering-vaults"
version = "0.1.0"
description = "Production AI engineering, taught as vaults: break it, measure it, fix it, gate it"
readme = "README.md"
authors = [{ name = "Param Harrison", email = "param@learnwithparam.com" }]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-ai-slim>=0.0.30",
    "langgraph>=0.2.40",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "crewai>=0.80.0",
    "mcp>=1.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.1.0",
    "ipywidgets>=8.0.0",
    "nest-asyncio>=1.5.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installing the helper package means a notebook can `import vault` from any
# folder. Notebooks run with their own directory as the working directory.
packages = ["vault"]
